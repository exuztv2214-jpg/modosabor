<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      /*
        La ventanita dice una sola cosa: si está conectada o no.

        Todo lo técnico —la dirección del servidor, la clave, el intervalo— vive
        adentro y no se muestra. Era exactamente lo que sobraba en la versión
        anterior: cuatro campos que nadie sabía completar y que, cuando uno
        quedaba mal, no daban ningún error.
      */
      * {
        box-sizing: border-box;
      }
      body {
        width: 290px;
        margin: 0;
        padding: 18px;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
        color: #0f172a;
      }
      .marca {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 16px;
      }
      .logo {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: #dc1f2d;
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 12px;
      }
      .marca b {
        font-size: 14px;
      }
      .marca span {
        display: block;
        font-size: 10px;
        letter-spacing: 0.09em;
        color: #94a3b8;
        text-transform: uppercase;
        font-weight: 700;
      }
      .estado {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 13px 14px;
        border-radius: 11px;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.45;
      }
      .estado.bien {
        background: #ecfdf5;
        border: 1px solid #a7f3d0;
        color: #065f46;
      }
      .estado.falta {
        background: #fffbeb;
        border: 1px solid #fde68a;
        color: #92400e;
      }
      .estado.mal {
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #b91c1c;
      }
      .punto {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex: none;
      }
      .bien .punto {
        background: #10b981;
      }
      .falta .punto {
        background: #f59e0b;
      }
      .mal .punto {
        background: #ef4444;
      }
      p.ayuda {
        margin: 13px 0 0;
        font-size: 12px;
        line-height: 1.55;
        color: #64748b;
      }
      .detalle {
        margin-top: 12px;
        font-size: 11px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="marca">
      <div class="logo">MS</div>
      <div>
        <b>Modo Sabor</b>
        <span>Social</span>
      </div>
    </div>

    <div id="estado" class="estado falta">
      <span class="punto"></span>
      <span id="texto">Cargando…</span>
    </div>

    <p class="ayuda" id="ayuda"></p>
    <div class="detalle" id="detalle"></div>

    <script src="popup.js"></script>
  </body>
</html>
