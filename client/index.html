<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Era #5D87FF, el azul de la plantilla original. Este color pinta la barra
         del navegador en Android y la pantalla de arranque de la PWA: con el
         azul, el cliente abría la carta y lo primero que veía no era la marca. -->
    <meta name="theme-color" content="#DC1F2D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Modo Sabor" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/admin-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/admin-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <title>Modo Sabor</title>
    <!-- Vista previa al compartir el enlace (WhatsApp, Facebook): las promos de
         Masivos terminan con "Pedí ahora" y este enlace. -->
    <meta name="description" content="Comida casera en Monteros. Pedí online y te lo llevamos." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Modo Sabor" />
    <meta property="og:title" content="Modo Sabor · Pedí online" />
    <meta property="og:description" content="Comida casera en Monteros. Elegí tu menú y te lo llevamos." />
    <meta property="og:url" content="https://www.modosabor.com.ar/" />
    <meta property="og:image" content="https://www.modosabor.com.ar/og-modosabor.png" />
    <meta property="og:image:width" content="340" />
    <meta property="og:image:height" content="340" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
