services:
  n8n:
    # Versión fijada: evita que un reinicio instale una versión distinta sin
    # haber probado antes los workflows de pedidos.
    image: n8nio/n8n:2.34.4
    restart: unless-stopped
    ports:
      # Los webhooks del agente los consume un proceso local. No exponemos
      # n8n a toda la red del local.
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      # Las tools del agente usan estas variables para llegar al backend sin
      # incrustar secretos en el workflow exportable.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      MODO_SABOR_API_URL: ${MODO_SABOR_API_URL}
      AGENT_API_KEY: ${AGENT_API_KEY}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL}
      NVIDIA_MODEL: ${NVIDIA_MODEL}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
