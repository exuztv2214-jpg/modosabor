<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#181b1f" />
    <title>Modo Sabor · Centro Operativo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0..200"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="__MASIVOS_BASE__/styles.css" />
    <link rel="stylesheet" href="__MASIVOS_BASE__/overrides.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegación principal">
        <div class="brand">
          <span class="brand-mark"><i></i><i></i><i></i></span
          ><span><strong>Modo Sabor</strong><small>PROMO PRO</small></span>
        </div>
        <div class="branch-select">
          <span><b class="status-dot"></b><span id="shell-branch">Modo Sabor</span></span
          ><span class="material-symbols-outlined">storefront</span>
        </div>
        <section class="channel-card">
          <div class="channel-title">
            <b class="status-dot"></b> WHATSAPP <span>DESCONECTADO</span>
          </div>
          <strong id="channel-phone">Conectá tu cuenta para comenzar</strong>
          <button class="link-button" data-action="qr" type="button">
            Ver QR / Estado <span class="material-symbols-outlined">qr_code_2</span>
          </button>
        </section>
        <nav class="primary-nav">
          <button class="nav-item active" aria-label="01. Inicio" data-route="inicio">
            <span class="nav-number">01.</span
            ><span class="material-symbols-outlined">storefront</span><span>Inicio</span>
          </button>
          <button class="nav-item" aria-label="02. Campaña" data-route="campana">
            <span class="nav-number">02.</span
            ><span class="material-symbols-outlined">campaign</span><span>Campaña</span
            ><em>Borrador</em>
          </button>
          <button class="nav-item" aria-label="03. Contactos" data-route="contactos">
            <span class="nav-number">03.</span><span class="material-symbols-outlined">group</span
            ><span>Contactos</span><em id="nav-contacts">—</em>
          </button>
          <button class="nav-item" aria-label="04. Conversaciones" data-route="conversaciones">
            <span class="nav-number">04.</span><span class="material-symbols-outlined">chat</span
            ><span>Conversaciones</span><em id="nav-inbox">0</em>
          </button>
          <button class="nav-item" aria-label="05. Resultados" data-route="resultados">
            <span class="nav-number">05.</span
            ><span class="material-symbols-outlined">query_stats</span><span>Resultados</span>
          </button>
          <button class="nav-item" aria-label="06. Configuración" data-route="configuracion">
            <span class="nav-number">06.</span><span class="material-symbols-outlined">shield</span
            ><span>Configuración</span>
          </button>
        </nav>
        <div class="sidebar-health">
          <div><span>SALUD DE LÍNEA</span><strong id="sidebar-health-value">—</strong></div>
          <div class="health-meter"><i id="sidebar-health-bar"></i></div>
          <div class="health-footer">
            <span class="material-symbols-outlined">verified_user</span
            ><span id="sidebar-health-label">Sin conexión</span>
          </div>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <div class="crumbs">
            <span>Centro<br />Operativo</span><b>/</b
            ><strong id="shell-business">Modo Sabor</strong>
          </div>
          <div class="operation-pill">
            <b class="status-dot"></b
            ><span id="shell-operation">Motor: <strong id="shell-batch">en espera</strong></span>
          </div>
          <div class="top-actions">
            <button class="button secondary compact" data-action="qr">
              <span class="material-symbols-outlined">qr_code_2</span>Escanear QR
            </button>
            <button class="button secondary compact" data-action="refresh">
              <span class="material-symbols-outlined">sync</span>Actualizar Contactos
            </button>
            <button class="button primary compact" data-route="campana">
              <span class="material-symbols-outlined">add</span>Nueva Campaña
            </button>
          </div>
          <div class="operator">
            <span><strong id="shell-user">—</strong><small id="shell-role">Panel local</small></span
            ><b class="operator-avatar" id="shell-avatar">·</b>
          </div>
        </header>
        <main id="app" tabindex="-1"></main>
      </div>
    </div>
    <nav class="mobile-nav" aria-label="Navegación móvil">
      <button data-route="inicio">
        <span class="material-symbols-outlined">storefront</span>Inicio
      </button>
      <button data-route="campana">
        <span class="material-symbols-outlined">campaign</span>Campaña
      </button>
      <button data-route="contactos">
        <span class="material-symbols-outlined">group</span>CRM
      </button>
      <button data-route="conversaciones">
        <span class="material-symbols-outlined">chat</span>Chats
      </button>
      <button data-route="configuracion">
        <span class="material-symbols-outlined">more_horiz</span>Más
      </button>
    </nav>
    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status"></div>
    <script>
      window.__MODO_SABOR_MASIVOS_BASE_PATH__ = '__MASIVOS_BASE__';
    </script>
    <script src="__MASIVOS_BASE__/app.js"></script>
  </body>
</html>
